
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0A0A0C;--surface:#111115;--card:#18181D;--card2:#1F1F26;
--accent:#E8A030;--accent2:#F2C46D;--accent-dim:rgba(232,160,48,0.12);
--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
--text:#F0EFE8;--muted:#7A7A8A;--muted2:#4A4A5A;
--success:#2ECC71;--danger:#E74C4C;--info:#4A9EF5;
--radius:10px;--radius2:14px
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.shell{display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
.logo-mark{display:flex;align-items:center;gap:10px}
.logo-icon{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:16px;height:16px;fill:#000}
.logo-text{font-size:15px;font-weight:600;letter-spacing:-0.3px}
.logo-sub{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.nav{padding:16px 12px;flex:1}
.nav-label{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);padding:0 8px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--radius);cursor:pointer;font-size:13.5px;font-weight:400;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke-width:1.8}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);border-color:rgba(232,160,48,0.2)}
.nav-item.active svg{stroke:var(--accent)}
.sidebar-footer{padding:16px;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);background:var(--card)}
.user-av{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#000;flex-shrink:0}
.user-name{font-size:12px;font-weight:500}
.user-role{font-size:10px;color:var(--muted);margin-top:1px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:18px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
.page-title{font-size:20px;font-weight:600;letter-spacing:-0.5px}
.page-sub{font-size:12px;color:var(--muted);margin-top:2px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--card);color:var(--text)}
.btn-danger{background:rgba(231,76,76,0.12);color:var(--danger);border:1px solid rgba(231,76,76,0.2)}
.btn-danger:hover{background:rgba(231,76,76,0.22)}
.content{flex:1;overflow-y:auto;padding:28px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px 18px}
.stat-label{font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat-val{font-size:26px;font-weight:600;letter-spacing:-1px}
.stat-val.accent{color:var(--accent)}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;transition:border-color .15s}
.item-card:hover{border-color:var(--border2)}
.item-img{width:100%;height:150px;object-fit:cover;background:var(--card2);display:block}
.item-img-placeholder{width:100%;height:150px;background:var(--card2);display:flex;align-items:center;justify-content:center}
.item-img-placeholder svg{width:32px;height:32px;stroke:var(--muted2);stroke-width:1.5}
.item-body{padding:14px}
.item-name{font-size:13.5px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-cat{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.item-price{font-size:18px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent);margin-bottom:12px}
.item-actions{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;transition:all .15s}
.icon-btn svg{width:14px;height:14px}
.icon-btn-edit{background:rgba(74,158,245,0.12);color:var(--info)}
.icon-btn-edit:hover{background:rgba(74,158,245,0.25)}
.icon-btn-del{background:rgba(231,76,76,0.1);color:var(--danger)}
.icon-btn-del:hover{background:rgba(231,76,76,0.22)}
.empty-state{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;color:var(--muted)}
.empty-state svg{width:48px;height:48px;stroke:var(--muted2);stroke-width:1;margin-bottom:16px}
.empty-state p{font-size:14px}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;width:440px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:16px;font-weight:600;letter-spacing:-0.3px}
.modal-close{width:28px;height:28px;border-radius:7px;background:var(--card);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-close svg{width:14px;height:14px;stroke:currentColor}
.modal-close:hover{background:var(--card2);color:var(--text)}
.modal-body{padding:20px 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-size:13.5px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.field select option{background:var(--card)}
.img-preview{width:100%;height:130px;border-radius:var(--radius);background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:6px;border:1px solid var(--border)}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-preview-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted2)}
.img-preview-empty svg{width:28px;height:28px;stroke:currentColor}
.img-preview-empty span{font-size:11px}
.modal-footer{padding:0 24px 20px;display:flex;gap:8px;justify-content:flex-end}
/* Customize section */
.section-heading{font-size:13px;font-weight:600;letter-spacing:-0.2px;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.section-heading::after{content:'';flex:1;height:1px;background:var(--border)}
.carousel-list{display:flex;flex-direction:column;gap:10px}
.carousel-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);display:flex;align-items:center;gap:14px;padding:12px 14px;transition:border-color .15s}
.carousel-item:hover{border-color:var(--border2)}
.carousel-thumb{width:80px;height:48px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--card2)}
.carousel-thumb-empty{width:80px;height:48px;border-radius:8px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.carousel-thumb-empty svg{width:18px;height:18px;stroke:var(--muted2)}
.carousel-info{flex:1;min-width:0}
.carousel-name{font-size:13px;font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carousel-url{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carousel-acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.order-btns{display:flex;flex-direction:column;gap:2px}
.order-btn{width:22px;height:18px;background:var(--card2);border:1px solid var(--border);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.order-btn:hover{color:var(--text);border-color:var(--border2)}
.order-btn svg{width:10px;height:10px;stroke:currentColor}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:9px;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.badge-main{background:rgba(232,160,48,0.15);color:var(--accent)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-banner-zone{border:1.5px dashed var(--border2);border-radius:var(--radius2);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:all .15s;margin-top:14px;color:var(--muted)}
.add-banner-zone:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.add-banner-zone svg{width:24px;height:24px;stroke:currentColor}
.add-banner-zone span{font-size:13px;font-weight:500}
.tab-row{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:3px;margin-bottom:20px;width:fit-content}
.tab{padding:6px 14px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s;font-weight:500;font-family:'DM Sans',sans-serif;background:transparent;border:none}
.tab.active{background:var(--accent);color:#000}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;z-index:1100}
.confirm-box{background:var(--surface);border:1px solid rgba(231,76,76,0.3);border-radius:14px;padding:24px;width:320px;text-align:center}
.confirm-icon{width:44px;height:44px;border-radius:50%;background:rgba(231,76,76,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.confirm-icon svg{width:20px;height:20px;stroke:var(--danger)}
.confirm-title{font-size:15px;font-weight:600;margin-bottom:6px}
.confirm-sub{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.confirm-acts{display:flex;gap:8px;justify-content:center}
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 16 16"><path d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
        </div>
        <div>
          <div class="logo-text">AdminKit</div>
          <div class="logo-sub">Panel v2.0</div>
        </div>
      </div>
    </div>
    <nav class="nav">
      <div class="nav-label">gestión</div>
      <div class="nav-item active" onclick="setPage('items')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Productos
      </div>
      <div class="nav-item" onclick="setPage('customize')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Personalizar Sitio
      </div>
      <div class="nav-label" style="margin-top:20px">utilidades</div>
      <div class="nav-item" onclick="">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
        Categorías
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Configuración
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-av">AD</div>
        <div>
          <div class="user-name">Admin</div>
          <div class="user-role">Super Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar" id="topbar">
      <div>
        <div class="page-title" id="page-title">Productos</div>
        <div class="page-sub" id="page-sub">Gestiona tu catálogo de productos</div>
      </div>
      <div class="topbar-actions" id="topbar-actions">
        <button class="btn btn-primary" onclick="openCreateModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo Producto
        </button>
      </div>
    </div>

    <div class="content" id="main-content">
      <!-- Items page rendered by JS -->
    </div>
  </div>
</div>

<!-- Create/Edit Modal -->
<div class="overlay" id="item-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Nuevo Producto</div>
      <button class="modal-close" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Imagen URL</label>
        <div class="img-preview" id="img-preview">
          <div class="img-preview-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <span>Vista previa</span>
          </div>
        </div>
        <input type="text" id="field-img" placeholder="https://ejemplo.com/imagen.jpg" oninput="updatePreview()" />
      </div>
      <div class="two-col">
        <div class="field">
          <label>Nombre</label>
          <input type="text" id="field-name" placeholder="Nombre del producto" />
        </div>
        <div class="field">
          <label>Precio (USD)</label>
          <input type="number" id="field-price" placeholder="0.00" step="0.01" min="0" />
        </div>
      </div>
      <div class="field">
        <label>Categoría</label>
        <input type="text" id="field-cat" placeholder="Ej: Electrónica, Ropa, Hogar..." />
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea id="field-desc" placeholder="Descripción del producto..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveItem()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- Banner Modal -->
<div class="overlay" id="banner-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Agregar Imagen al Carrusel</div>
      <button class="modal-close" onclick="closeBannerModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>URL de la imagen</label>
        <div class="img-preview" id="banner-preview">
          <div class="img-preview-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            <span>Vista previa banner</span>
          </div>
        </div>
        <input type="text" id="banner-url" placeholder="https://ejemplo.com/banner.jpg" oninput="updateBannerPreview()" />
      </div>
      <div class="field">
        <label>Título (opcional)</label>
        <input type="text" id="banner-title" placeholder="Ej: Oferta de verano" />
      </div>
      <div class="field">
        <label>Subtítulo (opcional)</label>
        <input type="text" id="banner-sub" placeholder="Ej: Hasta 50% de descuento" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeBannerModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveBanner()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Agregar
      </button>
    </div>
  </div>
</div>

<!-- Confirm delete -->
<div class="confirm-overlay" id="confirm-overlay" style="display:none">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </div>
    <div class="confirm-title" id="confirm-title">¿Eliminar elemento?</div>
    <div class="confirm-sub" id="confirm-sub">Esta acción no se puede deshacer.</div>
    <div class="confirm-acts">
      <button class="btn btn-ghost" onclick="cancelDelete()">Cancelar</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Sí, eliminar</button>
    </div>
  </div>
</div>

<script>
let items=[
  {id:1,name:"Auriculares Pro X",price:89.99,cat:"Electrónica",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=300&fit=crop",desc:"Sonido premium con cancelación de ruido activa"},
  {id:2,name:"Zapatillas Urban",price:124.50,cat:"Calzado",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=300&fit=crop",desc:"Diseño urbano con máximo confort"},
  {id:3,name:"Mochila Explorer",price:65.00,cat:"Accesorios",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400&h=300&fit=crop",desc:"Resistente al agua, 30L de capacidad"},
  {id:4,name:"Smartwatch Series 7",price:299.99,cat:"Electrónica",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=300&fit=crop",desc:"Monitoreo de salud en tiempo real"},
  {id:5,name:"Gafas Sol Vintage",price:45.00,cat:"Accesorios",img:"https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=300&fit=crop",desc:"Marco metálico dorado, lentes polarizados"},
  {id:6,name:"Cámara Polaroid",price:79.00,cat:"Electrónica",img:"https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400&h=300&fit=crop",desc:"Fotos instantáneas retro, incluye película"},
];
let banners=[
  {id:1,url:"https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&h=400&fit=crop",title:"Gran Oferta de Temporada",sub:"Hasta 40% en toda la tienda",main:true},
  {id:2,url:"https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1200&h=400&fit=crop",title:"Nueva Colección",sub:"Moda primavera-verano 2025",main:false},
  {id:3,url:"https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1200&h=400&fit=crop",title:"Tecnología Premium",sub:"Los mejores gadgets del año",main:false},
];
let currentPage='items';
let editingId=null;
let deletingId=null;
let deletingType=null;
let nextId=100;

function setPage(p){
  currentPage=p;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if(p==='items'){
    document.getElementById('page-title').textContent='Productos';
    document.getElementById('page-sub').textContent='Gestiona tu catálogo de productos';
    document.getElementById('topbar-actions').innerHTML=`<button class="btn btn-primary" onclick="openCreateModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg>Nuevo Producto</button>`;
  } else {
    document.getElementById('page-title').textContent='Personalizar Sitio';
    document.getElementById('page-sub').textContent='Configura el aspecto visual de tu tienda';
    document.getElementById('topbar-actions').innerHTML='';
  }
  render();
}

function render(){
  const c=document.getElementById('main-content');
  if(currentPage==='items') renderItems(c);
  else renderCustomize(c);
}

function renderItems(c){
  const total=items.reduce((a,i)=>a+i.price,0);
  const cats=[...new Set(items.map(i=>i.cat))].length;
  c.innerHTML=`
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Total Productos</div><div class="stat-val accent">${items.length}</div></div>
      <div class="stat-card"><div class="stat-label">Categorías</div><div class="stat-val">${cats}</div></div>
      <div class="stat-card"><div class="stat-label">Precio Promedio</div><div class="stat-val" style="font-family:'DM Mono',monospace;font-size:20px">$${items.length?(total/items.length).toFixed(2):'0.00'}</div></div>
      <div class="stat-card"><div class="stat-label">Valor Total</div><div class="stat-val" style="font-family:'DM Mono',monospace;font-size:20px;color:var(--success)">$${total.toFixed(2)}</div></div>
    </div>
    <div class="items-grid" id="items-grid">
      ${items.length?items.map(i=>itemCard(i)).join(''):`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg><p>No hay productos aún</p></div>`}
    </div>
  `;
}

function itemCard(i){
  return `<div class="item-card">
    ${i.img?`<img class="item-img" src="${i.img}" alt="${i.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="item-img-placeholder" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`:`<div class="item-img-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></div>`}
    <div class="item-body">
      <div class="item-name">${i.name}</div>
      <div class="item-cat">${i.cat||'Sin categoría'}</div>
      <div class="item-price">$${i.price.toFixed(2)}</div>
      <div class="item-actions">
        <button class="icon-btn icon-btn-edit" onclick="openEditModal(${i.id})" title="Editar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn icon-btn-del" onclick="askDelete(${i.id},'item')" title="Eliminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
    </div>
  </div>`;
}

function renderCustomize(c){
  c.innerHTML=`
    <div class="section-heading">Carrusel / Banner Principal</div>
    <div class="carousel-list" id="carousel-list">
      ${banners.map((b,idx)=>bannerRow(b,idx)).join('')}
    </div>
    <div class="add-banner-zone" onclick="openBannerModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
      <span>Agregar imagen al carrusel</span>
    </div>
    <div style="margin-top:32px">
      <div class="section-heading">Vista previa del Carrusel</div>
      <div style="border-radius:var(--radius2);overflow:hidden;border:1px solid var(--border);position:relative;background:var(--card2);height:200px;display:flex;align-items:center;justify-content:center">
        ${banners.length?`<img src="${banners[0].url}" style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0" onerror="this.style.display='none'">
        <div style="position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:20px 20px 16px">
          <div style="font-size:16px;font-weight:600;color:#fff">${banners[0].title||''}</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:3px">${banners[0].sub||''}</div>
        </div>
        <div style="position:absolute;bottom:10px;right:14px;display:flex;gap:5px">
          ${banners.map((b,i)=>`<div style="width:${i===0?'20':'8'}px;height:8px;border-radius:4px;background:${i===0?'var(--accent)':'rgba(255,255,255,0.4)'}"></div>`).join('')}
        </div>`:`<div style="color:var(--muted);font-size:13px">No hay banners configurados</div>`}
      </div>
    </div>
  `;
}

function bannerRow(b,idx){
  return `<div class="carousel-item">
    ${b.url?`<img class="carousel-thumb" src="${b.url}" onerror="this.style.background='var(--card2)'">`:`<div class="carousel-thumb-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m21 15-5-5L5 21"/></svg></div>`}
    <div class="carousel-info">
      <div class="carousel-name">${b.title||'Sin título'} ${b.main?'<span class="badge badge-main">Principal</span>':''}</div>
      <div class="carousel-url">${b.url}</div>
    </div>
    <div class="carousel-acts">
      <div class="order-btns">
        <button class="order-btn" onclick="moveBanner(${b.id},-1)" ${idx===0?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <button class="order-btn" onclick="moveBanner(${b.id},1)" ${idx===banners.length-1?'disabled style="opacity:0.3"':''}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <button class="icon-btn icon-btn-del" onclick="askDelete(${b.id},'banner')" title="Eliminar banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="m19 6-.867 12.142A2 2 0 0 1 16.138 20H7.862a2 2 0 0 1-1.995-1.858L5 6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>
  </div>`;
}

function moveBanner(id,dir){
  const idx=banners.findIndex(b=>b.id===id);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=banners.length)return;
  [banners[idx],banners[newIdx]]=[banners[newIdx],banners[idx]];
  banners[0].main=true;
  if(banners.length>1) for(let i=1;i<banners.length;i++)banners[i].main=false;
  render();
}

function openCreateModal(){
  editingId=null;
  document.getElementById('modal-title').textContent='Nuevo Producto';
  document.getElementById('field-name').value='';
  document.getElementById('field-price').value='';
  document.getElementById('field-cat').value='';
  document.getElementById('field-desc').value='';
  document.getElementById('field-img').value='';
  document.getElementById('img-preview').innerHTML=`<div class="img-preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Vista previa</span></div>`;
  document.getElementById('item-modal').style.display='flex';
}

function openEditModal(id){
  const item=items.find(i=>i.id===id);
  if(!item)return;
  editingId=id;
  document.getElementById('modal-title').textContent='Editar Producto';
  document.getElementById('field-name').value=item.name;
  document.getElementById('field-price').value=item.price;
  document.getElementById('field-cat').value=item.cat||'';
  document.getElementById('field-desc').value=item.desc||'';
  document.getElementById('field-img').value=item.img||'';
  const prev=document.getElementById('img-preview');
  if(item.img) prev.innerHTML=`<img src="${item.img}" style="width:100%;height:100%;object-fit:cover">`;
  else prev.innerHTML=`<div class="img-preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Vista previa</span></div>`;
  document.getElementById('item-modal').style.display='flex';
}

function closeModal(){document.getElementById('item-modal').style.display='none';}

function updatePreview(){
  const url=document.getElementById('field-img').value;
  const prev=document.getElementById('img-preview');
  if(url) prev.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<div class=\\'img-preview-empty\\'><span>URL no válida</span></div>'">`;
  else prev.innerHTML=`<div class="img-preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Vista previa</span></div>`;
}

function saveItem(){
  const name=document.getElementById('field-name').value.trim();
  const price=parseFloat(document.getElementById('field-price').value)||0;
  const cat=document.getElementById('field-cat').value.trim();
  const desc=document.getElementById('field-desc').value.trim();
  const img=document.getElementById('field-img').value.trim();
  if(!name)return;
  if(editingId){
    const item=items.find(i=>i.id===editingId);
    Object.assign(item,{name,price,cat,desc,img});
  } else {
    items.push({id:nextId++,name,price,cat,desc,img});
  }
  closeModal();render();
}

function askDelete(id,type){
  deletingId=id;deletingType=type;
  const name=type==='item'?items.find(i=>i.id===id)?.name:banners.find(b=>b.id===id)?.title||'este banner';
  document.getElementById('confirm-title').textContent=`¿Eliminar "${name}"?`;
  document.getElementById('confirm-sub').textContent=type==='item'?'El producto se eliminará permanentemente del catálogo.':'La imagen se eliminará del carrusel.';
  document.getElementById('confirm-overlay').style.display='flex';
}

function cancelDelete(){deletingId=null;deletingType=null;document.getElementById('confirm-overlay').style.display='none';}

function confirmDelete(){
  if(deletingType==='item') items=items.filter(i=>i.id!==deletingId);
  else {banners=banners.filter(b=>b.id!==deletingId);if(banners.length)banners[0].main=true;}
  cancelDelete();render();
}

function openBannerModal(){
  document.getElementById('banner-url').value='';
  document.getElementById('banner-title').value='';
  document.getElementById('banner-sub').value='';
  document.getElementById('banner-preview').innerHTML=`<div class="img-preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Vista previa banner</span></div>`;
  document.getElementById('banner-modal').style.display='flex';
}

function closeBannerModal(){document.getElementById('banner-modal').style.display='none';}

function updateBannerPreview(){
  const url=document.getElementById('banner-url').value;
  const prev=document.getElementById('banner-preview');
  if(url) prev.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover">`;
  else prev.innerHTML=`<div class="img-preview-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Vista previa banner</span></div>`;
}

function saveBanner(){
  const url=document.getElementById('banner-url').value.trim();
  if(!url)return;
  const title=document.getElementById('banner-title').value.trim();
  const sub=document.getElementById('banner-sub').value.trim();
  banners.push({id:nextId++,url,title,sub,main:banners.length===0});
  closeBannerModal();render();
}

render();
</script>
</body>
</html>
